name: Format multi-print files

on:
  push:
    branches:
      - feat/multi-file-print-batch

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/multi-file-print-batch
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/web/src/components/mobile/batch-mobile-flow.tsx
          apps/web/test/e2e/print-flow.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/mobile/batch-mobile-flow.tsx \
            apps/web/test/e2e/print-flow.spec.ts
          git commit -m "Format final multi-file printing changes"
          git push origin HEAD:feat/multi-file-print-batch
