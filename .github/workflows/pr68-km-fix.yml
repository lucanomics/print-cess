name: PR68 one-shot numeral consistency fix

on:
  push:
    branches:
      - claude/print-cess-file-sharing-gtrt2n

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Keep tested locales on one numeral script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('packages/i18n/src/index.ts')
          s = p.read_text()
          digit_sets = {
              'km': '០១២៣៤៥៦៧៨៩',
              'ne': '०१२३४५६७८९',
              'ar': '٠١٢٣٤٥٦٧٨٩',
              'th': '๐๑๒๓๔๕๖๗๘๙',
          }

          total_changes = 0
          for locale, native in digit_sets.items():
              start = s.index(f'const {locale} = {{')
              next_const = s.find('\nconst ', start + 1)
              end = len(s) if next_const == -1 else next_const
              block = s[start:end]
              normalized = block.translate(str.maketrans(native, '0123456789'))
              changes = sum(a != b for a, b in zip(block, normalized))
              total_changes += changes
              s = s[:start] + normalized + s[end:]
              print(f'{locale}: normalized {changes} native numeral characters')

          if total_changes < 1:
              raise SystemExit('Expected at least one native numeral to normalize')
          p.write_text(s)
          PY
          pnpm exec prettier --write packages/i18n/src/index.ts
      - name: Verify i18n tests
        run: pnpm --filter @print-cess/i18n test
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/i18n/src/index.ts
          git commit -m "fix(i18n): keep transfer numerals consistent"
          git push origin "HEAD:${GITHUB_REF_NAME}"
