name: PR68 one-shot numeral consistency fix

on:
  push:
    branches:
      - claude/print-cess-file-sharing-gtrt2n

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Keep Khmer and Nepali locales on one numeral script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('packages/i18n/src/index.ts')
          s = p.read_text()

          def normalize_block(text: str, start: str, end: str, native: str) -> tuple[str, int]:
              left = text.index(start)
              right = text.index(end, left)
              block = text[left:right]
              table = str.maketrans(native, '0123456789')
              normalized = block.translate(table)
              changes = sum(a != b for a, b in zip(block, normalized))
              return text[:left] + normalized + text[right:], changes

          s, km_changes = normalize_block(
              s,
              'const km = {',
              '\nconst ar = {',
              '០១២៣៤៥៦៧៨៩',
          )
          s, ne_changes = normalize_block(
              s,
              'const ne = {',
              '\nconst km = {',
              '०१२३४५६७८९',
          )
          if km_changes < 1 or ne_changes < 1:
              raise SystemExit(
                  f'Expected native numeral fixes in both locales; km={km_changes}, ne={ne_changes}'
              )
          p.write_text(s)
          PY
          pnpm exec prettier --write packages/i18n/src/index.ts
      - name: Verify i18n tests
        run: pnpm --filter @print-cess/i18n test
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/i18n/src/index.ts
          git commit -m "fix(i18n): keep transfer numerals consistent"
          git push origin "HEAD:${GITHUB_REF_NAME}"
