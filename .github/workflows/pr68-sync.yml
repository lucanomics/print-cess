name: PR68 one-shot main sync

on:
  push:
    branches:
      - claude/print-cess-file-sharing-gtrt2n

permissions:
  contents: write

jobs:
  sync-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Merge main and resolve the three semantic overlaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already an ancestor; nothing to do"
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            # Keep the hand-off additions/removal of spoken guidance, then
            # re-apply the small reviewed locale corrections from #65 below.
            git checkout --ours -- packages/i18n/src/index.ts

            # Start the two documentation overlaps from the reviewed main copy,
            # then re-apply the feature PR's no-audio/file-hand-off wording.
            git checkout origin/main -- docs/ACCESSIBILITY_LANGUAGE_ACCEPTANCE.md docs/REMAINING_RISKS.md
          fi

          python <<'PY'
          from pathlib import Path

          p = Path('packages/i18n/src/index.ts')
          s = p.read_text()
          replacements = [
            ('closedBody: "You can close this tab now."', 'closedBody: "You can close this page now."'),
            ('guideIntro: "네 단계만 하면 됩니다. 앱을 설치하거나 로그인하지 않아도 돼요."', 'guideIntro: "네 단계만 하면 끝나요. 앱을 설치하거나 로그인하지 않아도 돼요."'),
            ('guideScanBody: "휴대전화 카메라로 스캔했어요. 이 단계는 끝났습니다."', 'guideScanBody: "휴대전화 카메라로 스캔했어요. 이 단계는 끝났어요."'),
            ('문서를 변환하려고 다른 회사에 보내지 않습니다.', '문서를 변환하려고 다른 회사에 보내지 않아요.'),
            ('previewHelp: "아래에 보이는 그대로 인쇄됩니다. 잘 확인하세요."', 'previewHelp: "아래에 보이는 그대로 인쇄돼요. 잘 확인하세요."'),
            ('privacySummary: "문서는 보내는 동안 잠겨 있고, 인쇄가 끝나면 바로 지워집니다."', 'privacySummary: "문서는 보내는 동안 잠겨 있고, 인쇄가 끝나면 바로 지워져요."'),
            ('completed: "인쇄가 끝났어요"', 'completed: "모두 끝났어요"'),
            ('closedTitle: "인쇄가 끝났습니다"', 'closedTitle: "인쇄가 끝났어요"'),
            ('closedBody: "이제 이 탭을 닫아도 됩니다."', 'closedBody: "이제 이 화면을 닫아도 돼요."'),
            ('곧 종이가 나옵니다.', '곧 종이가 나와요.'),
            ('closedBody: "现在可以关掉这个标签页了。"', 'closedBody: "现在可以关闭这个页面了。"'),
            ('closedBody: "Anda boleh menutup tab ini sekarang."', 'closedBody: "Anda boleh menutup halaman ini sekarang."'),
            ('halaman yang perlu.', 'halaman yang diperlukan.'),
            ('Dapat wala pang 20 MB ang larawan at wala pang 10 MB ang PDF', 'Dapat mas maliit sa 20 MB ang larawan at mas maliit sa 10 MB ang PDF'),
            ('closedBody: "Puwede mo nang isara ang tab na ito."', 'closedBody: "Puwede mo nang isara ang pahinang ito."'),
            ('closedBody: "Bây giờ bạn có thể đóng thẻ này."', 'closedBody: "Bây giờ bạn có thể đóng trang này."'),
            ('closedBody: "ตอนนี้ปิดแท็บนี้ได้เลย"', 'closedBody: "ตอนนี้ปิดหน้านี้ได้เลย"'),
            ('closedBody: "अब यो ट्याब बन्द गर्न सक्नुहुन्छ।"', 'closedBody: "अब यो पृष्ठ बन्द गर्न सक्नुहुन्छ।"'),
            ('guideIntro: "មានតែ ៤ ជំហាន។ មិនត្រូវការកម្មវិធី ឬគណនីទេ។"', 'guideIntro: "មានតែ 4 ជំហាន។ មិនត្រូវការកម្មវិធី ឬគណនីទេ។"'),
            ('guideReminder: "អានជំហានទាំង ៤ រួចចុចប៊ូតុងខាងក្រោម។"', 'guideReminder: "អានជំហានទាំង 4 រួចចុចប៊ូតុងខាងក្រោម។"'),
            ('hwpxUnavailable: "ម៉ាស៊ីនបោះពុម្ពនេះមិនអាចបើកឯកសារ HWPX បានទេ។ រក្សាទុកជា PDF រួចជ្រើសម្តងទៀត។"', 'hwpxUnavailable: "ម៉ាស៊ីនបោះពុម្ពនេះមិនអាចបើកឯកសារ HWPX បានទេ។ រក្សាទុកឯកសារជា PDF រួចជ្រើសម្តងទៀត។"'),
            ('printSummary: "១ ច្បាប់ · ក្រដាស A4 · សខ្មៅ · ម្ខាង"', 'printSummary: "1 ច្បាប់ · ក្រដាស A4 · សខ្មៅ · ម្ខាង"'),
            ('printOneCopy: "បោះពុម្ព ១ ច្បាប់"', 'printOneCopy: "បោះពុម្ព 1 ច្បាប់"'),
            ('closedBody: "ឥឡូវនេះអ្នកអាចបិទផ្ទាំងនេះបាន។"', 'closedBody: "ឥឡូវនេះអ្នកអាចបិទទំព័រនេះបាន។"'),
            ('helpGuide: "អានជំហានខ្លីទាំង ៤។', 'helpGuide: "អានជំហានខ្លីទាំង 4។'),
            ('“បោះពុម្ព ១ ច្បាប់”', '“បោះពុម្ព 1 ច្បាប់”'),
            ('closedBody: "يمكنك إغلاق هذه التبويبة الآن."', 'closedBody: "يمكنك إغلاق هذه الصفحة الآن."'),
            ('Вы отсканировали его камерой телефона. Этот шаг сделан.', 'Вы отсканировали его камерой телефона. Этот шаг уже выполнен.'),
            ('Принтер стоит рядом с большим экраном. Забирайте лист там.', 'Принтер стоит рядом с большим экраном. Заберите лист там.'),
            ('closedBody: "Теперь эту вкладку можно закрыть."', 'closedBody: "Теперь эту страницу можно закрыть."'),
            ('closedBody: "Одоо энэ табыг хааж болно."', 'closedBody: "Одоо энэ хуудсыг хааж болно."'),
            ('Энэ файл хэтэрхий том. Зураг 20 MB, PDF 10 MB-аас бага байх ёстой, эсвэл шаардлагатай хуудсаа хадгална уу.', 'Энэ файл хэтэрхий том. Зураг 20 MB-аас, PDF 10 MB-аас бага байх ёстой. Эсвэл шаардлагатай хуудсаа хадгална уу.'),
            ('Ви відсканували його камерою телефону. Цей крок готовий.', 'Ви відсканували його камерою телефону. Цей крок уже виконано.'),
            ('closedBody: "Тепер цю вкладку можна закрити."', 'closedBody: "Тепер цю сторінку можна закрити."'),
          ]
          for old, new in replacements:
            s = s.replace(old, new)
          p.write_text(s)

          p = Path('docs/ACCESSIBILITY_LANGUAGE_ACCEPTANCE.md')
          s = p.read_text()
          s = s.replace(
            'reduced motion, speech unavailable, and muted audio. Text must remain sufficient without color,\nicon, animation, or audio.',
            'reduced motion, and muted audio. The visitor flow carries no spoken guidance, so text must be\nsufficient on its own — without color, icon, animation, or sound.',
          )
          s = s.replace(
            'One qualified native reviewer per locale must review all visible text and speech in context:',
            'One qualified native reviewer per locale must review all visible text in context, for both the\nprint flow and the file hand-off:',
          )
          s = s.replace(
            'insufficient. Pre-recorded operational audio, if adopted, needs the same reviewer and a second\nlistening check on the target kiosk.',
            'insufficient.',
          )
          s = s.replace('; whether the audio is intelligible.', '.')
          p.write_text(s)

          p = Path('docs/REMAINING_RISKS.md')
          s = p.read_text()
          s = s.replace(
            'Author-written copy/audio gives unsafe or confusing instruction in a language no reviewer has read',
            'Author-written copy gives unsafe or confusing instruction in a language no reviewer has read',
          )
          s = s.replace(
            'English source of truth, short flows, text retained if speech fails, one reviewed table per locale with no override layer, a documented authoring pass, and automated guards for placeholder, quoted-label, numeral and Korean-register defects',
            'English source of truth, short flows, one instruction per screen, one reviewed table per locale with no override layer, a documented authoring pass, and automated guards for placeholder, quoted-label, numeral and Korean-register defects',
          )
          s = s.replace(
            'Browser/device variance breaks file picker, preview, speech, crypto, or direct PUT',
            'Browser/device variance breaks file picker, preview, storage, crypto, or direct PUT',
          )
          p.write_text(s)

          p = Path('pnpm-workspace.yaml')
          s = p.read_text().replace('nanoid@<3.3.17: 3.3.17', 'nanoid@<3.3.18: 3.3.18')
          marker = 'minimumReleaseAgeExclude:\n'
          if '  - nanoid@3.3.18\n' not in s:
            s = s.replace(marker, marker + '  - nanoid@3.3.18\n')
          p.write_text(s)
          PY

          corepack enable
          pnpm install --lockfile-only --no-frozen-lockfile

          git add -A
          if git ls-files -u | grep -q .; then
            echo "Unresolved merge entries remain:"
            git ls-files -u
            exit 1
          fi
          git commit -m "merge main into transfer branch and resolve review findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
