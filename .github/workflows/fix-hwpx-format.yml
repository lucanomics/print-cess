name: Fix HWPX formatting

on:
  push:
    branches:
      - feat/direct-hwpx-printing

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/direct-hwpx-printing

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Fix HWPX edge cases and native guidance
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("apps/web/src/lib/file-validation.ts"); s=p.read_text(); old="  if (fileKind === \"pdf\") {\n"; new="  if (fileKind === \"hwpx\") {\n    if (!options.allowHwpx) throw new FileValidationError(\"hwpxUnavailable\");\n    return { bytes, fileKind, pageCount: 1, normalized: false };\n  }\n\n  if (fileKind === \"pdf\") {\n"; assert old in s; p.write_text(s.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("apps/kiosk/Paradiso.PrintCess.Kiosk/ViewModels/MainViewModel.cs"); s=p.read_text(); old="SecondaryInstruction = \"Wi-Fi는 필요하지 않습니다. 휴대전화 모바일 데이터를 사용하세요\";"; new="SecondaryInstruction = \"QR코드를 비춘 뒤 휴대전화 화면에 나타나는 링크를 누르세요\";"; assert old in s; s=s.replace(old,new,1); old="SetProgress(KioskUiState.Claimed, \"휴대전화 연결됨\", \"휴대전화에서 문서를 선택해 주세요\", \"PDF, JPG, PNG 파일 한 개를 보낼 수 있습니다\", preserveDeadline: true);"; new="SetProgress(KioskUiState.Claimed, \"휴대전화 연결됨\", \"휴대전화에서 문서를 선택해 주세요\", \"휴대전화 화면에 표시되는 지원 형식의 파일 한 개를 보낼 수 있습니다\", preserveDeadline: true);"; assert old in s; p.write_text(s.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("apps/web/test/e2e/expanded-formats.spec.ts"); s=p.read_text(); old="Save this HWP, Office, or text document as PDF on your phone, then choose it again. To protect your document, Print-cess does not send the original to an external conversion service."; new="Save this HWP, Office, or text document as PDF on your phone, then choose it again. HWPX can be sent directly only to a configured Windows kiosk."; assert old in s; p.write_text(s.replace(old,new,1))'

      - name: Apply Prettier
        run: >-
          pnpm exec prettier --write
          apps/web/src/components/mobile/mobile-flow.tsx
          apps/web/src/lib/file-validation.ts
          apps/web/src/lib/hwpx-validation.ts
          apps/web/test/e2e/expanded-formats.spec.ts
          packages/i18n/src/public.ts

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps packages
          git commit -m "fix: normalize HWPX flow and native guidance"
          git push origin HEAD:feat/direct-hwpx-printing
