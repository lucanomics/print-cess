name: Temporary HEIC lockfile update

on:
  push:
    branches:
      - feat/expand-file-format-support

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/expand-file-format-support
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): lock client-side HEIC decoder"
          git push origin HEAD:feat/expand-file-format-support
