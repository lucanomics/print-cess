name: PR68 one-shot format

on:
  push:
    branches:
      - claude/print-cess-file-sharing-gtrt2n

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the two files flagged by CI
        run: pnpm exec prettier --write docs/REMAINING_RISKS.md packages/i18n/src/index.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REMAINING_RISKS.md packages/i18n/src/index.ts
          git commit -m "style: format merged PR68 files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
