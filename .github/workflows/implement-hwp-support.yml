  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/direct-hwp-printing
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply HWP support patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              value = p.read_text()
              if old not in value:
                  raise SystemExit(f"anchor missing: {path}: {old[:80]!r}")
              p.write_text(value.replace(old, new, count))

          replace("packages/protocol/src/envelope.ts", "  hwpx: 4,\n", "  hwpx: 4,\n  hwp: 5,\n")
          replace(
              "packages/protocol/src/session.ts",
              "    supportsHwpx: z.boolean().optional().default(false),\n",
              "    supportsHwpx: z.boolean().optional().default(false),\n    supportsHwp: z.boolean().optional().default(false),\n",
          )
          replace(
              "apps/web/src/app/api/sessions/route.ts",
              '    const capability = input.supportsHwpx ? "&hwpx=1" : "";\n',
              '    const capability = `${input.supportsHwpx ? "&hwpx=1" : ""}${input.supportsHwp ? "&hwp=1" : ""}`;\n',
