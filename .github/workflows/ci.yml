name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      # Without a UTF-8 locale the browser sanitizes non-ASCII download names
      # down to "download", so a Korean file name would fail here for a reason
      # that has nothing to do with the service.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PUBLIC_BASE_URL: http://127.0.0.1:3000
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      PRINT_CESS_ADAPTER_MODE: local
      SESSION_TTL_SECONDS: "180"
      SIGNED_URL_TTL_SECONDS: "120"
      ENABLE_DEMO_ROUTES: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Workflow policy tests
        run: pnpm test:workflow

      - name: External readiness evidence policy tests
        run: pnpm test:acceptance-evidence

      - name: Browser kiosk launcher tests
        run: pnpm test:kiosk-scripts

      - name: Integration tests
        run: pnpm test:integration

      - name: Production build
        run: pnpm build

      # A stalled Ubuntu mirror once spent 23 of this job's 35 minutes inside
      # `playwright install --with-deps` and the end-to-end tests never ran.
      # Drop a stalled connection instead of waiting on it, cache the browser
      # binaries, and bound the two installs separately so a slow mirror fails
      # one short step rather than silently consuming the whole job budget.
      - name: Make apt tolerate a slow mirror
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-print-cess-retries > /dev/null

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        timeout-minutes: 12
        run: pnpm --filter @print-cess/web exec playwright install-deps chromium webkit

      - name: Install Playwright browsers
        timeout-minutes: 12
        run: pnpm --filter @print-cess/web exec playwright install chromium webkit

      - name: End-to-end tests
        run: pnpm test:e2e

      # The verdict is the exit code of the steps above; this upload only makes
      # the run inspectable afterwards. It stays visible when it fails, but a
      # full Actions storage quota must not turn a passing test run red.
      - name: Upload web test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: web-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/coverage/**
            **/playwright-report/**
          if-no-files-found: warn
          retention-days: 3

  windows-kiosk:
    name: Windows kiosk
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PRINT_CESS_USE_MOCK_PRINT_ENGINE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test signing and acceptance evidence policy
        shell: pwsh
        run: ./scripts/windows/Test-AcceptancePolicy.ps1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          dotnet-quality: ga

      - name: Restore
        run: dotnet restore apps/kiosk/Paradiso.PrintCess.sln --locked-mode

      - name: Build WPF solution
        run: dotnet build apps/kiosk/Paradiso.PrintCess.sln -c Release --no-restore

      - name: Run kiosk tests
        run: >-
          dotnet test
          apps/kiosk/Paradiso.PrintCess.Tests/Paradiso.PrintCess.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=print-cess-tests.trx"
          --results-directory artifacts/test-results

      - name: Publish self-contained Windows x64 kiosk
        run: >-
          dotnet publish
          apps/kiosk/Paradiso.PrintCess.Kiosk/Paradiso.PrintCess.Kiosk.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/kiosk-win-x64

      # The publish step only proves the project compiles into a single file if
      # something checks the file is there. Assert it here rather than through
      # `if-no-files-found`, so the assertion holds even when the upload cannot
      # run. Released binaries come from `release-kiosk.yml`, not from this job.
      - name: Verify the publish produced a single-file executable
        shell: pwsh
        run: |
          $exe = "artifacts/kiosk-win-x64/Print-cess Kiosk.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "The publish did not produce '$exe'."
          }
          Get-Item -LiteralPath $exe | Select-Object Name, Length | Format-List

      - name: Upload Windows test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/**
          if-no-files-found: warn
          retention-days: 7

      # A self-contained single-file build is the largest thing this repository
      # uploads, so shortening its retention is the obvious way to relieve
      # storage pressure — and the wrong one. `PRODUCTION_BLOCKERS.md` still
      # carries an unchecked blocker requiring publish-smoke evidence to expire
      # after seven days, and `TEST_PLAN.md` makes uploaded Windows evidence a
      # release exit criterion. Seven days it stays; free the quota instead.
      - name: Upload kiosk publish smoke artifact
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: kiosk-win-x64-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/kiosk-win-x64/**
          if-no-files-found: warn
          retention-days: 7
