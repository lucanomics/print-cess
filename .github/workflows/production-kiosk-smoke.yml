name: Production kiosk smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-kiosk-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Live session registration (${{ matrix.base-url }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        base-url:
          - https://print-cess.vercel.app
          - https://paradiso-print-cess-web.vercel.app
    steps:
      - name: Verify the live kiosk and session API
        env:
          BASE_URL: ${{ matrix.base-url }}
        run: |
          set -euo pipefail

          request_body="$(printf '{\"protocolVersion\":1,\"kioskPublicKey\":\"B%s\",\"kioskPublicKeyFingerprint\":\"%s\"}' "$(printf 'A%.0s' {1..86})" "$(printf 'A%.0s' {1..43})")"

          for attempt in $(seq 1 36); do
            page_code="$(curl --location --silent --show-error --output /tmp/kiosk.html --write-out '%{http_code}' "$BASE_URL/kiosk" || true)"
            api_code="$(curl --location --silent --show-error --output /tmp/session.json --write-out '%{http_code}' \
              --request POST \
              --header "Origin: $BASE_URL" \
              --header 'Content-Type: application/json' \
              --data "$request_body" \
              "$BASE_URL/api/kiosk/sessions" || true)"

            if [[ "$page_code" == "200" && "$api_code" == "201" ]] && grep --quiet '"status":"waiting"' /tmp/session.json; then
              echo "$BASE_URL kiosk session registration succeeded."
              exit 0
            fi

            error_code="$(node -e 'try { const value = JSON.parse(require("fs").readFileSync("/tmp/session.json", "utf8")); process.stdout.write(value?.error?.code ?? "none"); } catch { process.stdout.write("unreadable"); }')"
            echo "Attempt $attempt: host=$BASE_URL kiosk=$page_code session=$api_code error=$error_code"
            sleep 10
          done

          echo "$BASE_URL did not create a waiting session after repeated checks."
          exit 1
