name: Apply HWPX web patch

on:
  push:
    branches:
      - feat/direct-hwpx-printing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/direct-hwpx-printing
      - name: Apply exact mobile updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              target = Path(path)
              value = target.read_text()
              if old not in value:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:100]!r}")
              target.write_text(value.replace(old, new, 1))

          replace(
              "apps/web/src/lib/file-validation.ts",
              "import { MAX_PDF_PAGES, MAX_PLAINTEXT_BYTES, type FileKind } from \"@print-cess/protocol\";",
              "import { MAX_PDF_PAGES, MAX_PLAINTEXT_BYTES, type FileKind } from \"@print-cess/protocol\";\n\nimport { isHwpxSelection, validateHwpxHeader } from \"./hwpx-validation\";",
          )
          replace(
              "apps/web/src/lib/file-validation.ts",
              "  | \"documentNeedsPdf\"\n  | \"imageConversionUnsupported\"",
              "  | \"documentNeedsPdf\"\n  | \"hwpxUnavailable\"\n  | \"imageConversionUnsupported\"",
          )
          replace(
              "apps/web/src/lib/file-validation.ts",
              "): \"image\" | \"document\" | \"unknown\" {\n  const extension = fileExtension(file.name);",
              "): \"image\" | \"hwpx\" | \"document\" | \"unknown\" {\n  const extension = fileExtension(file.name);\n  if (isHwpxSelection(file)) return \"hwpx\";",
          )
          replace(
              "apps/web/src/lib/file-validation.ts",
              "export async function validateFileForMobile(file: File): Promise<ValidatedMobileFile> {",
              "export async function validateFileForMobile(\n  file: File,\n  options: { allowHwpx?: boolean } = {},\n): Promise<ValidatedMobileFile> {",
          )
          replace(
              "apps/web/src/lib/file-validation.ts",
              "  const bytes = new Uint8Array(await file.arrayBuffer());\n  let fileKind: FileKind;",
              "  const bytes = new Uint8Array(await file.arrayBuffer());\n  if (classification === \"hwpx\") {\n    if (!options.allowHwpx) throw new FileValidationError(\"hwpxUnavailable\");\n    try {\n      validateHwpxHeader(bytes);\n    } catch {\n      throw new FileValidationError(\"damagedFile\");\n    }\n    return { bytes, fileKind: \"hwpx\", pageCount: 1, normalized: false };\n  }\n\n  let fileKind: FileKind;",
          )
          replace(
              "apps/web/src/lib/file-validation.ts",
              "  if (\n    bytes.byteLength >= PNG_SIGNATURE.length &&",
              "  if (\n    bytes.byteLength >= PNG_SIGNATURE.length &&",
          )
          replace(
              "apps/web/src/lib/file-validation.ts",
              "  )\n    return \"png\";\n  throw new FileValidationError(\"unsupportedType\");",
              "  )\n    return \"png\";\n  try {\n    validateHwpxHeader(bytes);\n    return \"hwpx\";\n  } catch {\n    throw new FileValidationError(\"unsupportedType\");\n  }",
          )

          replace(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              "  const [progressKey, setProgressKey] = useState(\"encrypting\");",
              "  const [progressKey, setProgressKey] = useState(\"encrypting\");\n  const [supportsHwpx, setSupportsHwpx] = useState(false);",
          )
          replace(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              "      try {\n        const nextMobileToken = generateToken();",
              "      try {\n        setSupportsHwpx(fragment.supportsHwpx);\n        const nextMobileToken = generateToken();",
          )
          replace(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              "        const result = await validateFileForMobile(selected);",
              "        const result = await validateFileForMobile(selected, { allowHwpx: supportsHwpx });",
          )
          replace(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              "    [clearDocument],\n  );",
              "    [clearDocument, supportsHwpx],\n  );",
          )
          replace(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              "      {stage === \"guide\" ? <GuideStep text={text} onContinue={() => setStage(\"file\")} /> : null}",
              "      {stage === \"guide\" ? (\n        <GuideStep\n          text={text}\n          supportsHwpx={supportsHwpx}\n          onContinue={() => setStage(\"file\")}\n        />\n      ) : null}",
          )
          replace(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              "          <p>{text(\"fileRules\")}</p>",
              "          <p>{text(supportsHwpx ? \"fileRulesHwpx\" : \"fileRules\")}</p>",
          )
          replace(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              "            type=\"file\"\n            onChange={(event) => void chooseFile(event.target.files?.[0])}",
              "            type=\"file\"\n            accept=\"application/pdf,application/hwp+zip,image/*,.pdf,.hwpx,.jpg,.jpeg,.png,.heic,.heif,.webp,.avif,.bmp,.gif,.tif,.tiff\"\n            onChange={(event) => void chooseFile(event.target.files?.[0])}",
          )
          replace(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              "              firstPagePreview: text(\"firstPagePreview\"),",
              "              firstPagePreview: text(\"firstPagePreview\"),\n              hwpxPreview: text(\"hwpxPreview\"),",
          )
          replace(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              "function GuideStep({\n  text,\n  onContinue,\n}: {\n  text: (key: string, values?: Record<string, string | number>) => string;\n  onContinue: () => void;\n}) {",
              "function GuideStep({\n  text,\n  supportsHwpx,\n  onContinue,\n}: {\n  text: (key: string, values?: Record<string, string | number>) => string;\n  supportsHwpx: boolean;\n  onContinue: () => void;\n}) {",
          )
          replace(
              "apps/web/src/components/mobile/mobile-flow.tsx",
              "    { icon: ImageIcon, title: \"guideChooseTitle\", body: \"guideChooseBody\", completed: false },",
              "    {\n      icon: ImageIcon,\n      title: \"guideChooseTitle\",\n      body: supportsHwpx ? \"guideChooseBodyHwpx\" : \"guideChooseBody\",\n      completed: false,\n    },",
          )

          renderer = Path("apps/kiosk/Paradiso.PrintCess.Infrastructure/Printing/HancomHwpxRenderer.cs")
          value = renderer.read_text()
          value = value.replace(
              "    private const string SecurityModuleEnvironmentVariable = \"PRINT_CESS_HANCOM_SECURITY_MODULE\";\n\n    public static Task<byte[]>",
              "    private const string SecurityModuleEnvironmentVariable = \"PRINT_CESS_HANCOM_SECURITY_MODULE\";\n\n    public static bool IsAvailable =>\n        !string.IsNullOrWhiteSpace(Environment.GetEnvironmentVariable(SecurityModuleEnvironmentVariable)) &&\n        (Type.GetTypeFromProgID(\"HWPFrame.HwpObject.2\", throwOnError: false) is not null ||\n         Type.GetTypeFromProgID(\"HWPFrame.HwpObject\", throwOnError: false) is not null);\n\n    public static Task<byte[]>",
              1,
          )
          value = value.replace(
              "}\n#endif\n",
              "}\n#else\nnamespace Paradiso.PrintCess.Infrastructure.Printing;\n\ninternal static class HancomHwpxRenderer\n{\n    public static bool IsAvailable => false;\n}\n#endif\n",
              1,
          )
          renderer.write_text(value)

          replace(
              "apps/kiosk/Paradiso.PrintCess.Infrastructure/Http/KioskSessionClient.cs",
              "using Paradiso.PrintCess.Core.Protocol;",
              "using Paradiso.PrintCess.Core.Protocol;\nusing Paradiso.PrintCess.Infrastructure.Printing;",
          )
          PY
      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps
          git commit -m "feat(web): advertise HWPX only to capable Windows kiosks"
          git push origin HEAD:feat/direct-hwpx-printing
