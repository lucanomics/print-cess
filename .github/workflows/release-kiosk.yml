name: Release kiosk

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (vX.Y.Z or vX.Y.Z-rc.N)
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable
      publish_release:
        description: Publish a GitHub Release after the protected environment approves
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-kiosk-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build tagged kiosk
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      WORKFLOW_REF_TYPE: ${{ github.ref_type }}
      WORKFLOW_REF_NAME: ${{ github.ref_name }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Require the matching workflow tag ref
        shell: pwsh
        run: |
          if ($env:WORKFLOW_REF_TYPE -cne "tag") {
            throw "Release signing must be dispatched from the requested tag ref."
          }
          if ($env:WORKFLOW_REF_NAME -cne $env:RELEASE_TAG) {
            throw "The workflow ref must exactly match the requested release tag."
          }

      - name: Check out requested tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for release policy validation
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Validate tag, channel, commit, and main ancestry
        run: node scripts/github/validate-release-context.mjs

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          dotnet-quality: ga

      - name: Restore
        run: dotnet restore apps/kiosk/Paradiso.PrintCess.sln --locked-mode

      - name: Build
        run: dotnet build apps/kiosk/Paradiso.PrintCess.sln -c Release --no-restore

      - name: Test
        env:
          PRINT_CESS_USE_MOCK_PRINT_ENGINE: "true"
        run: >-
          dotnet test
          apps/kiosk/Paradiso.PrintCess.Tests/Paradiso.PrintCess.Tests.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=print-cess-tests.trx"
          --results-directory artifacts/test-results

      - name: Publish self-contained Windows x64 kiosk
        run: >-
          dotnet publish
          apps/kiosk/Paradiso.PrintCess.Kiosk/Paradiso.PrintCess.Kiosk.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/kiosk-win-x64

      - name: Upload unsigned handoff
        uses: actions/upload-artifact@v7
        with:
          name: Print-cess-Kiosk-${{ inputs.tag }}-unsigned-handoff
          path: artifacts/kiosk-win-x64/**
          if-no-files-found: error
          retention-days: 1

      - name: Upload tagged test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Print-cess-Kiosk-${{ inputs.tag }}-test-evidence
          path: artifacts/test-results/**
          if-no-files-found: warn
          retention-days: 14

  sign:
    name: Authenticode sign and verify
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    environment: windows-signing
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
      EXPECTED_PUBLISHER_SUBJECT: ${{ vars.AUTHENTICODE_EXPECTED_SUBJECT }}
      TIMESTAMP_URL: ${{ vars.AUTHENTICODE_TIMESTAMP_URL }}
    steps:
      - name: Download unsigned handoff
        uses: actions/download-artifact@v8
        with:
          name: Print-cess-Kiosk-${{ inputs.tag }}-unsigned-handoff
          path: artifacts/kiosk-win-x64

      - name: Validate protected signing configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) {
            throw "The protected Windows signing certificate is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw "The protected Windows signing certificate password is not configured."
          }
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_PUBLISHER_SUBJECT)) {
            throw "AUTHENTICODE_EXPECTED_SUBJECT is not configured in windows-signing."
          }
          $timestamp = $null
          if (-not [Uri]::TryCreate($env:TIMESTAMP_URL, [UriKind]::Absolute, [ref]$timestamp)) {
            throw "AUTHENTICODE_TIMESTAMP_URL must be an absolute approved timestamp URL."
          }
          if ($timestamp.Scheme -notin @("http", "https")) {
            throw "AUTHENTICODE_TIMESTAMP_URL must use HTTP or HTTPS."
          }

      - name: Sign executable and verify Authenticode policy
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "print-cess-authenticode.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $certificatePath,
              [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
            )
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signTool) {
              throw "A Windows SDK x64 signtool.exe installation was not found."
            }
            $executables = @(Get-ChildItem artifacts/kiosk-win-x64 -Recurse -File |
              Where-Object { $_.Name -eq "Print-cess Kiosk.exe" })
            if ($executables.Count -ne 1) {
              throw "Expected exactly one Print-cess Kiosk.exe signing target."
            }
            $executable = $executables[0]
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr $env:TIMESTAMP_URL /f $certificatePath /p $env:SIGNING_CERTIFICATE_PASSWORD $executable.FullName
            if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed." }

            New-Item -ItemType Directory -Force artifacts/signing-evidence | Out-Null
            & $signTool.FullName verify /pa /all /v $executable.FullName 2>&1 |
              Tee-Object -FilePath artifacts/signing-evidence/authenticode-verification.txt
            if ($LASTEXITCODE -ne 0) { throw "SignTool Authenticode verification failed." }

            $signature = Get-AuthenticodeSignature $executable.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "PowerShell did not report a valid Authenticode signature."
            }
            if (-not $signature.SignerCertificate.Subject.Contains(
              $env:EXPECTED_PUBLISHER_SUBJECT,
              [StringComparison]::OrdinalIgnoreCase
            )) {
              throw "The signer certificate subject does not match the approved publisher."
            }
          } finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Remove symbols and create signed archive
        shell: pwsh
        run: |
          Get-ChildItem artifacts/kiosk-win-x64 -Recurse -File -Filter *.pdb |
            Remove-Item -Force
          $version = $env:RELEASE_TAG.TrimStart("v")
          $archive = "artifacts/Print-cess-Kiosk-$version-win-x64-signed.zip"
          Compress-Archive -Path "artifacts/kiosk-win-x64/*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $line = "$hash *$(Split-Path -Leaf $archive)"
          Set-Content -Path "$archive.sha256" -Value $line -Encoding ascii

      - name: Upload signed release candidate
        uses: actions/upload-artifact@v7
        with:
          name: Print-cess-Kiosk-${{ inputs.tag }}-win-x64-signed
          path: |
            artifacts/Print-cess-Kiosk-*-win-x64-signed.zip
            artifacts/Print-cess-Kiosk-*-win-x64-signed.zip.sha256
            artifacts/signing-evidence/authenticode-verification.txt
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release
    if: ${{ needs.sign.result == 'success' && inputs.publish_release && vars.ENABLE_GITHUB_RELEASES == 'true' }}
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download candidate
        uses: actions/download-artifact@v8
        with:
          name: Print-cess-Kiosk-${{ inputs.tag }}-win-x64-signed
          path: release-assets

      - name: Publish prerelease
        if: ${{ inputs.channel == 'prerelease' }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --prerelease
          --generate-notes
          --title "Print-cess Kiosk $RELEASE_TAG"

      - name: Publish stable release
        if: ${{ inputs.channel == 'stable' }}
        run: >-
          gh release create "$RELEASE_TAG"
          release-assets/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Print-cess Kiosk $RELEASE_TAG"
