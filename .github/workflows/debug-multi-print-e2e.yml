name: Debug multi-print E2E

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  debug:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PUBLIC_BASE_URL: http://127.0.0.1:3000
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      PRINT_CESS_ADAPTER_MODE: local
      SESSION_TTL_SECONDS: "180"
      SIGNED_URL_TTL_SECONDS: "120"
      ENABLE_DEMO_ROUTES: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/multi-file-print-batch
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages used by the web app
        run: pnpm exec turbo run build --filter=@print-cess/web^...
      - run: pnpm --filter @print-cess/web exec playwright install --with-deps chromium
      - name: Capture multi-file print test
        shell: bash
        run: |
          set +e
          pnpm --filter @print-cess/web exec playwright test test/e2e/print-flow.spec.ts --project=chromium --grep "one kiosk scan prints multiple" --retries=0 --reporter=line > e2e-debug.txt 2>&1
          code=$?
          printf '\nEXIT_CODE=%s\n' "$code" >> e2e-debug.txt
          cat e2e-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e-debug.txt
          git commit -m "Capture multi-print E2E failure" || true
          git push origin HEAD:feat/multi-file-print-batch
          exit 0
