name: Temporary format Preview origin fix

on:
  push:
    branches:
      - fix/vercel-preview-origin

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/vercel-preview-origin

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/web/src/app/api/demo/sessions/route.ts
          apps/web/src/app/api/demo/sessions/route.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/api/demo/sessions/route.ts apps/web/src/app/api/demo/sessions/route.test.ts
          git commit -m "style(web): apply Prettier"
          git push
