name: Probe deployed Preview QR

on:
  pull_request:
    branches: [preview]

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.head_ref == 'repair/probe-preview-qr' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Discover and probe deployed Preview
        run: |
          curl --fail --silent --show-error \
            https://raw.githubusercontent.com/lucanomics/paradiso-print-cess/repair/probe-preview-qr/.github/scripts/probe-preview-qr.mjs \
            --output /tmp/probe-preview-qr.mjs
          node /tmp/probe-preview-qr.mjs
