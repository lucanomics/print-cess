name: Probe deployed Preview QR

on:
  pull_request:
    branches: [preview]

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.head_ref == 'repair/probe-preview-qr' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out diagnostic script
        uses: actions/checkout@v7

      - name: Discover and probe deployed Preview
        run: node .github/scripts/probe-preview-qr.mjs
