name: Probe deployed Preview QR

on:
  pull_request:
    branches: [preview]

permissions:
  contents: read

jobs:
  probe:
    if: ${{ github.head_ref == 'repair/probe-preview-qr' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Discover and probe deployed Preview
        shell: bash
        run: |
          node <<'NODE'
          const expectedSha = "dfb5a92a91173d72e62999aa0a5c898579955e6e";
          const candidates = new Set([
            "paradiso-print-cess-web-git-preview-club-paradiso.vercel.app",
          ]);

          const token = process.env.VERCEL_TOKEN;
          if (token) {
            const headers = { authorization: `Bearer ${token}` };
            const teamsResponse = await fetch("https://api.vercel.com/v2/teams?limit=100", { headers });
            if (!teamsResponse.ok) throw new Error(`Vercel teams API returned ${teamsResponse.status}`);
            const teams = (await teamsResponse.json()).teams ?? [];
            const team = teams.find((entry) => entry.slug === "club-paradiso");
            if (!team) throw new Error("Vercel team club-paradiso was not found");

            const projectResponse = await fetch(
              `https://api.vercel.com/v9/projects/paradiso-print-cess-web?teamId=${encodeURIComponent(team.id)}`,
              { headers },
            );
            if (!projectResponse.ok) throw new Error(`Vercel project API returned ${projectResponse.status}`);
            const project = await projectResponse.json();

            const deploymentsResponse = await fetch(
              `https://api.vercel.com/v6/deployments?projectId=${encodeURIComponent(project.id)}&teamId=${encodeURIComponent(team.id)}&limit=100`,
              { headers },
            );
            if (!deploymentsResponse.ok)
              throw new Error(`Vercel deployments API returned ${deploymentsResponse.status}`);
            const deployments = (await deploymentsResponse.json()).deployments ?? [];
            const deployment = deployments.find(
              (entry) =>
                entry.state === "READY" &&
                entry.meta?.githubCommitRef === "preview" &&
                (entry.meta?.githubCommitSha === expectedSha || entry.meta?.githubCommitSha?.startsWith(expectedSha.slice(0, 12))),
            ) ?? deployments.find(
              (entry) => entry.state === "READY" && entry.meta?.githubCommitRef === "preview",
            );
            if (!deployment) throw new Error("No READY Vercel deployment for the preview branch was found");

            if (deployment.url) candidates.add(deployment.url);
            for (const alias of deployment.alias ?? []) candidates.add(alias);
          }

          const body = JSON.stringify({
            protocolVersion: 1,
            kioskPublicKey: `B${"A".repeat(86)}`,
            kioskPublicKeyFingerprint: "A".repeat(43),
          });

          let passed;
          const failures = [];
          for (const host of candidates) {
            const origin = `https://${host}`;
            try {
              const root = await fetch(origin, { redirect: "follow" });
              const html = await root.text();
              const pageHasKiosk = root.ok && html.includes("QR코드를 스캔하세요");

              const api = await fetch(`${origin}/api/demo/sessions`, {
                method: "POST",
                headers: { "content-type": "application/json", origin },
                body,
              });
              const apiText = await api.text();
              const apiCreatedSession = api.status === 201 && apiText.includes('"qrUrl"');

              console.log(`${host}: root=${root.status}, kiosk=${pageHasKiosk}, sessionApi=${api.status}`);
              if (pageHasKiosk && apiCreatedSession) {
                passed = host;
                break;
              }
              failures.push(`${host}: root=${root.status}, kiosk=${pageHasKiosk}, sessionApi=${api.status}`);
            } catch (error) {
              failures.push(`${host}: ${error instanceof Error ? error.message : String(error)}`);
            }
          }

          if (!passed) {
            throw new Error(`No deployed Preview host passed the QR probe. ${failures.join(" | ")}`);
          }
          console.log(`QR preview verified at https://${passed}`);
          NODE
